[project]
name = "mcp-pandas"
version = "1.0.0"
description = "MCP server for pandas-based data analysis: profile files, run pandas code, and render charts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Guilherme Nogueira", email = "guilherme.nogueira@devantage.com.br" }]
keywords = ["mcp", "fastmcp", "pandas", "data-analysis", "csv", "excel", "charts"]

dependencies = [
    "fastmcp>=2.3.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
mcp-pandas = "mcp_pandas.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_pandas"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
